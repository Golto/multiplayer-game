<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rumeurs</title>
    <meta name="description" content="Rumeurs : jeu de bluff boursier entre amis, en salon privé." />
    <link rel="icon" type="image/svg+xml" href="/golpex.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap"
    />
    <script>
      // Évite le flash de thème avant le chargement du script principal.
      (function () {
        var m = document.cookie.match(/(?:^|; )app-theme=(light|dark)/);
        var dark = m ? m[1] === "dark" : window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
